server:
  host: "0.0.0.0"
  port: 8765

audio:
  sample_rate: 16000

vad:
  threshold: 0.5
  min_silence_ms: 700
  min_speech_ms: 250

stt:
  model: "large-v3"
  device: "cuda"
  compute_type: "float16"
  beam_size: 5
  language: "fr"

llm:
  base_url: "http://127.0.0.1:8080"
  model: "local-model"
  max_tokens: 1024
  temperature: 0.7

tts:
  device: "cuda"
  speaker_wav: "app/voices/default_fr.wav"
  sentence_silence: 0.3
  exaggeration: 0.5
  temperature: 0.6
  cfg_weight: 0.3
